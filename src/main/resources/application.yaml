server:
  port: 8080

spring:
  application:
    name: driveOS-api

  #MYSQL配置
  datasource:
    url: jdbc:mysql://localhost:3306/driveos?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 数据库版本迁移
  flyway:
    enabled: true
    baseline-on-migrate: true

# DriveOS 自定义配置
app:
  jwt:
    # 必须通过环境变量设置，不要将真实密钥提交到 Git
    secret: "9e+KIQ0XnMA5rDICEpDN0d0hiKK7xD+6PsjwrgIoEQ0="
    # Access Token 有效期：30 分钟
    access-expiration-ms: 1800000

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 下划线列名自动映射到驼峰属性，如 password_hash -> passwordHash
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，生产环境建议去掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键默认使用数据库自增
      id-type: auto
      # 实体名/属性名默认按下划线转换表名/列名
      table-underline: true